  <style>
    :root {
      --bg: #0b0710;
      --ink: #f3e9e4;
      --muted: #b9a8b3;
      --red: #c2253f;
      --gold: #d8a845;
      --card: rgba(26, 14, 26, 0.82);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% -10%, rgba(194, 37, 63, 0.35), transparent 60%),
        radial-gradient(ellipse at 10% 110%, rgba(90, 30, 110, 0.35), transparent 55%),
        var(--bg);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Noto Serif CJK JP", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      -webkit-text-size-adjust: 100%;
    }
    header { text-align: center; margin: 8px 0 22px; }
    .kicker { color: var(--gold); letter-spacing: 0.4em; font-size: 0.8rem; margin: 0 0 6px; }
    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 6vw, 2.6rem);
      letter-spacing: 0.12em;
      text-shadow: 0 0 18px rgba(194, 37, 63, 0.7), 0 2px 0 #000;
    }
    .lead { color: var(--muted); margin: 10px 0 0; font-size: 0.95rem; }
    .hair {
      width: min(320px, 70%);
      height: 1px;
      margin: 16px auto 0;
      background: linear-gradient(90deg, transparent, var(--red), var(--gold), var(--red), transparent);
    }
    main {
      width: 100%;
      max-width: 880px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    @media (min-width: 720px) { main { grid-template-columns: 1fr 1fr; gap: 24px; } }
    a.game {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid rgba(216, 168, 69, 0.35);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(194, 37, 63, 0.15);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    a.game:hover, a.game:focus-visible {
      transform: translateY(-3px);
      border-color: var(--gold);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.6), 0 0 22px rgba(194, 37, 63, 0.45);
      outline: none;
    }
    a.game:active { transform: translateY(0); }
    .thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: #120a14;
    }
    .thumb.rpg { object-position: 50% 20%; }
    .body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .tag {
      align-self: flex-start;
      font-size: 0.75rem;
      color: #fff;
      background: var(--red);
      padding: 2px 10px;
      border-radius: 999px;
      letter-spacing: 0.1em;
      font-family: system-ui, sans-serif;
    }
    h2 { margin: 0; font-size: 1.2rem; line-height: 1.45; }
    h2 small { display: block; font-size: 0.85rem; color: var(--muted); font-weight: normal; }
    .desc { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.6; font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .note { margin: 0; color: var(--gold); font-size: 0.85rem; font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .play {
      margin-top: auto;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      background: linear-gradient(180deg, #d8324d, #8f1529);
      color: #fff;
      font-weight: bold;
      letter-spacing: 0.2em;
      font-size: 1.05rem;
      font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    footer {
      margin-top: 28px;
      text-align: center;
      color: #8a7984;
      font-size: 0.75rem;
      line-height: 1.7;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <header>
    <p class="kicker">逆 髪 の 結 羅</p>
    <h1>結羅のゲーム</h1>
    <p class="lead">遊びたいゲームをえらんでください</p>
    <div class="hair"></div>
  </header>

  <main>
    <a class="game" href="rpg/" id="go-rpg">
      <img class="thumb rpg" src="assets/portal/rpg-thumb.jpg" alt="逆髪の結羅 RPG" width="480" height="360" />
      <div class="body">
        <span class="tag">RPG</span>
        <h2>逆髪の結羅<small>〜鬼の美少女の四魂の欠片集め〜（RPG）</small></h2>
        <p class="desc">犬夜叉の逆髪の結羅が主人公のファンRPG。四魂の欠片を集めて冒険。セーブデータはこれまでどおり使えます。</p>
        <span class="play">あそぶ</span>
      </div>
    </a>

    <a class="game" href="boken/" id="go-boken">
      <img class="thumb" src="assets/portal/boken-thumb.jpg" alt="結羅のぼうけん タイトル画面" width="640" height="358" />
      <div class="body">
        <span class="tag">ACTION</span>
        <h2>結羅のぼうけん<small>（横スクロールアクション）</small></h2>
        <p class="desc">ドット絵の結羅が走ってジャンプ、髪の毛でこうげき。</p>
        <p class="note">📱 スマホは横向きがおすすめ</p>
        <span class="play">あそぶ</span>
      </div>
    </a>
  </main>

  <footer>
    Fan work ／ 高橋留美子『犬夜叉』二次創作（非公式・非営利）
  </footer>
</body>
</html>
